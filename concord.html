</style>

const n=h("input",{value:c?c.name:"",maxLength:30,placeholder:"nome-do-canal"});
const t=h("input",{value:c?(c.topic||""):"",maxLength:120,placeholder:"Sobre o que é este canal?"});
const k=h("select",{},...S.cats.map(x=>h("option",{value:x.id,selected:x.id===(c?c.cat:catId)},x.name)));
modal(c?"Editar canal":"Novo canal",[field("Nome",n),field("Descrição",t),field("Tópico",k)],[c&&S.channels.length>1&&btn("Apagar",async()=>{close();try{await deleteDoc(doc(chRef(),c.id))}catch(e){onErr(e)}},"red"),btn("Cancelar",close),btn("Salvar",async()=>{const name=n.value.trim().toLowerCase().replace(/\s+/g,"-");if(!name)return;close();try{const d={name,topic:t.value.trim(),cat:k.value};if(c)await updateDoc(doc(chRef(),c.id),d);else await addDoc(chRef(),{...d,ts:Date.now()})}catch(e){onErr(e)}},"pri")]);
}

function catModal(k){
const n=h("input",{value:k?k.name:"",maxLength:30,placeholder:"Nome do tópico"});
modal(k?"Editar tópico":"Novo tópico",field("Nome",n),[k&&btn("Apagar",async()=>{if(S.channels.some(c=>c.cat===k.id)){toast("Apague ou mova os canais deste tópico primeiro.");return}close();try{await deleteDoc(doc(caRef(),k.id))}catch(e){onErr(e)}},"red"),btn("Cancelar",close),btn("Salvar",async()=>{const name=n.value.trim();if(!name)return;close();try{if(k)await updateDoc(doc(caRef(),k.id),{name});else await addDoc(caRef(),{name,ts:Date.now()})}catch(e){onErr(e)}},"pri")]);
}

function rolesModal(){
const s=cur();
const n=h("input",{placeholder:"Nome do cargo",maxLength:30,style:"flex:1"}),c=h("input",{type:"color",value:"#5865f2"});
const rows=Object.entries(s.roles||{}).map(([rid,r])=>h("div",{style:"border:1px solid var(--bd);border-radius:6px;padding:8px"},h("div",{className:"row"},h("span",{style:"width:14px;height:14px;border-radius:50%;background:"+cl(r.color)}),h("span",{className:"grow"},r.name),btn("Apagar",()=>updateDoc(sref(),{["roles."+rid]:deleteField()}).catch(onErr),"red")),...PERMS.map(([k,l])=>h("label",{className:"row"},h("input",{type:"checkbox",checked:r.perms.includes(k),on:{change:e=>updateDoc(sref(),{["roles."+rid+".perms"]:e.target.checked?arrayUnion(k):arrayRemove(k)}).catch(onErr)}}),l))));
modal("Cargos",[...rows,h("div",{className:"row"},n,c,btn("Adicionar",()=>{const name=n.value.trim();if(name)updateDoc(sref(),{["roles."+Math.random().toString(36).slice(2,9)]:{name,color:c.value,perms:[]}}).catch(onErr)}))],[btn("Fechar",close)]);
S.re=rolesModal;
}

function memberModal(id){
const p=usr(id),s=cur(),mine=(s.mr||{})[id]||[];
const roles=can("roles")?Object.entries(s.roles||{}).map(([rid,r])=>h("label",{className:"row"},h("input",{type:"checkbox",checked:mine.includes(rid),on:{change:e=>updateDoc(sref(),{["mr."+id]:e.target.checked?arrayUnion(rid):arrayRemove(rid)}).catch(onErr)}}),h("span",{style:"color:"+cl(r.color)},r.name))):[];
const names=mine.map(r=>(s.roles||{})[r]).filter(Boolean).map(r=>r.name).join(", ");
modal(p.name,[h("div",{className:"row"},av(p,56),h("div",{},names||"Sem cargo")),h("div",{className:"t"},p.bio||"Sem bio."),...roles],[can("kick")&&id!==S.uid&&id!==s.ownerId&&btn("Expulsar",async()=>{close();try{await updateDoc(sref(),{members:arrayRemove(id)})}catch(e){onErr(e)}},"red"),btn("Fechar",close)]);
}

function profileModal(){
const p=usr(S.uid);
const n=h("input",{value:p.name,maxLength:32}),b=h("textarea",{value:p.bio||"",maxLength:200,rows:3});
let avatar=p.avatar||null;
const prev=h("div",{className:"row"});
const draw=()=>prev.replaceChildren(av({name:n.value||"?",avatar},56),btn("Escolher foto da galeria",async()=>{const d=await pickImg(128,.8);if(d){avatar=d;draw()}}));
draw();
modal("Meu perfil",[field("Nome",n),field("Foto",prev),field("Bio",b)],[btn("Sair da conta",()=>{close();signOut(S.auth)},"red"),btn("Cancelar",close),btn("Salvar",async()=>{const name=n.value.trim();if(!name)return;close();try{await setDoc(doc(S.db,"users",S.uid),{name,bio:b.value.trim(),avatar:avatar||null},{merge:true})}catch(e){onErr(e)}},"pri")]);
}

function authScreen(msg){
const a=$("#auth");a.hidden=false;
const nm=h("input",{placeholder:"Nome de usuário",maxLength:32}),em=h("input",{type:"email",placeholder:"E-mail"}),pw=h("input",{type:"password",placeholder:"Senha (mínimo 6)"});
const run=async reg=>{try{if(reg){const name=nm.value.trim();if(!name){toast("Escolha um nome de usuário.");return}const c=await createUserWithEmailAndPassword(S.auth,em.value.trim(),pw.value);await setDoc(doc(S.db,"users",c.user.uid),{name,bio:"",avatar:null})}else await signInWithEmailAndPassword(S.auth,em.value.trim(),pw.value)}catch(e){onErr(e)}};
a.replaceChildren(h("div",{className:"box"},h("h3",{},"Concord"),msg&&h("div",{},msg),nm,em,pw,h("div",{className:"row"},btn("Entrar",()=>run(false),"pri"),btn("Criar conta",()=>run(true)))));
}

$("#send").onclick=()=>send();
$("#pic").onclick=async()=>{const d=await pickImg(900,.7);if(d)send(d)};
$("#inp").addEventListener("keydown",e=>{if(e.key==="Enter")send()});
$("#ed").onclick=()=>chanModal(S.channels.find(c=>c.id===S.cid));
$("#mb").onclick=()=>document.documentElement.classList.toggle("nav");
$("#tb").onclick=()=>document.documentElement.classList.toggle("mem");
$("#scrim").onclick=()=>document.documentElement.classList.remove("nav","mem");

if(CFG.apiKey.startsWith("@@")){authScreen("Falta colar a configuração do Firebase no arquivo (CFG).")}
else{
const app=initializeApp(CFG);
S.auth=getAuth(app);S.db=getFirestore(app);
onAuthStateChanged(S.auth,user=>{
Object.values(S.u).forEach(f=>f&&f());S.u={};
if(!user){S.uid=null;$("#app").hidden=true;authScreen();return}
S.uid=user.uid;$("#auth").hidden=true;$("#app").hidden=false;
S.u.us=onSnapshot(collection(S.db,"users"),s=>{S.users={};s.docs.forEach(d=>{S.users[d.id]=d.data()});render()},onErr);
S.u.sv=onSnapshot(query(collection(S.db,"servers"),where("members","array-contains",user.uid)),s=>{S.servers=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>a.ts-b.ts);if(S.sid&&!S.servers.find(x=>x.id===S.sid)){S.sid=null;S.channels=[];S.cats=[];S.cid=null;S.msgs=[]}if(!S.sid&&S.servers.length)selectServer(S.servers[0].id);else render();if(S.re)S.re()},onErr);
});
}
